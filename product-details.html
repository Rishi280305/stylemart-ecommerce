<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product details — StyleMart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Style<span>Mart</span></a>
      <form class="nav-search">
        <input type="search" placeholder="Search for products…" aria-label="Search products">
        <button type="submit" aria-label="Search">🔍</button>
      </form>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div class="nav-actions">
        <button class="btn-icon search-toggle" aria-label="Toggle search">🔍</button>
        <a href="cart.html" class="cart-link" aria-label="View cart">
          🛍️
          <span class="cart-count">0</span>
        </a>
        <button class="btn-icon hamburger" aria-label="Toggle menu">☰</button>
      </div>
    </div>
  </header>

  <div class="container">
    <p class="breadcrumb"><a href="index.html">Home</a> / <a href="products.html">Shop</a> / <span id="pd-breadcrumb-title">Product</span></p>
  </div>

  <main class="container">
    <div id="pd-state"></div>

    <div id="pd-content" class="pd-layout hidden">
      <div class="pd-media">
        <img id="pd-image" src="" alt="">
      </div>

      <div>
        <p class="pd-category" id="pd-category"></p>
        <h1 class="pd-title" id="pd-title"></h1>
        <div class="pd-rating">
          <span class="stars" id="pd-stars"></span>
          <span id="pd-rating-count"></span>
        </div>
        <p class="pd-price" id="pd-price"></p>
        <p class="pd-desc" id="pd-desc"></p>

        <div class="pd-actions-row">
          <div class="qty-control">
            <button id="pd-qty-minus" aria-label="Decrease quantity">−</button>
            <input type="number" id="pd-qty" value="1" min="1">
            <button id="pd-qty-plus" aria-label="Increase quantity">+</button>
          </div>
          <button class="btn btn-primary" id="pd-add-cart">Add to cart</button>
        </div>

        <ul class="pd-meta-list">
          <li><span>Category</span><span id="pd-meta-category"></span></li>
          <li><span>Product ID</span><span id="pd-meta-id"></span></li>
          <li><span>Shipping</span><span>Free over $50</span></li>
        </ul>

        <a href="products.html" class="btn btn-secondary pd-back">← Back to products</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© <span id="footer-year"></span> StyleMart</p>
        <p>Built with HTML, CSS &amp; vanilla JavaScript</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/product-details.js"></script>
</body>
</html>
